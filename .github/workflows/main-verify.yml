name: main-verify
# PR-green does not mean main-green. Two PRs can each pass their own gates and
# still break master together — a semantic conflict merges cleanly, and nothing
# re-runs the suite afterwards. This is the job that notices.
#
# Deliberately runs only the checks that need no BASE_REF. The drift instruments
# (C-06, C-08, G-05) measure a PR against its base and have no meaning on a
# branch that IS the base; gates.yml owns those.

# Branch is `main`, not `master`. This file arrived from f4d-dev-env-configurator,
# whose default branch IS master; carried over unchanged it would have watched a
# branch that does not exist here and never once run — a workflow that cannot
# fire is the CI equivalent of the gates this merge spent its time un-breaking.
# Caught the first time main moved, because nothing appeared in `gh run list`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: "main is green"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Install the conformance harness's one dependency
        # setup-python gives a clean interpreter with no PyYAML, so
        # conformance_test.sh's preflight failed here on the very first push to
        # master — while the PR's gates.yml run was green on the same commit,
        # because that job had no setup-python and inherited the runner image's
        # preinstalled PyYAML. This is precisely the divergence this workflow
        # exists to catch, and it caught it on its first run.
        #
        # Pinned, not bare: naming the dependency (this comment's own history)
        # stopped the runner-image divergence above, but a bare
        # `pip install pyyaml` still lets pip resolve whatever release is
        # newest *at run time*. A new PyYAML landing on PyPI between this PR's
        # gates.yml run and this job's later run on the merge commit
        # reproduces the same "green for a reason nothing in this repo
        # controls" problem one layer down — pip's resolver instead of the
        # runner image. Pinned to the exact same version as gates.yml,
        # deliberately; there is no shared lock/constraints file because this
        # is the repo's only Python dependency (verified: no
        # requirements/constraints/pyproject file exists, and every script
        # under scripts/ imports only stdlib + yaml) — introducing one for a
        # single package would be its own S-05-shaped debt. Bump both
        # `pip install pyyaml==` lines together when this needs to move.
        run: pip install pyyaml==6.0.3
      - name: Restore executable bits
        run: chmod +x hooks/*.sh tests/*.sh bootstrap.sh
      - name: Harnesses
        run: |
          fail=0
          for t in hooks render_registry render_instructions gate_trio statelessness conformance companions scanner_agreement agent_presence notion_sync token_build release; do
            echo "::group::${t}_test.sh"
            bash "tests/${t}_test.sh" || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - name: Snapshot gates
        run: |
          fail=0
          run() {
            echo "::group::$1"
            python "scripts/$1" || fail=1
            echo "::endgroup::"
          }
          run check_guess_lists.py     # S-05
          run check_statelessness.py   # ST-01..ST-07
          run check_catch_empty.py     # S-03
          run check_log_hygiene.py     # O-05
          run check_raw_sql.py         # D-06
          run check_pure_imports.py    # S-07
          run check_contract_pin.py    # K-02 K-03
          exit $fail
