name: gates
# The kit running its own gates. Until this existed, f4d-kit shipped gates.yml
# to every scaffolded repo and ran none of them on itself — the registry claimed
# enforcement the kit did not apply to its own PRs (§7.6). check_commits.py and
# check_test_count.py in particular had NEVER run here, because both need
# BASE_REF and only CI supplies it.
#
# Note the path difference from templates/github/gates.yml: scaffolded repos get
# the checks copied to .github/scripts/, but this repo IS the source, so they run
# from scripts/.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  harnesses:
    # No test count in this name, deliberately. It has carried one three times
    # (123 -> 133 -> 141) and gone stale within a day each time, because nothing
    # mechanically ties prose to reality — the same shape as a registry row
    # claiming enforcement nobody wired. The loop below prints the real per-suite
    # numbers on every run; a label that cannot go stale beats one that is
    # accurate today.
    name: "harnesses — every suite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Install the conformance harness's one dependency
        # conformance_test.sh preflights `import yaml` and fails loud without it.
        # This job previously had no setup-python and passed only because the
        # runner image happens to preinstall PyYAML into the system interpreter —
        # green for a reason nothing in this repo controls. main-verify.yml DID
        # pin an interpreter, got a clean one, and went red on master while this
        # job was green on the same commit. Naming the dependency removes the
        # difference; an implicit dependency is one the next runner image can
        # delete without telling anyone.
        #
        # Pinned, not bare: naming it was not the same as controlling it. A
        # bare `pip install pyyaml` still lets pip resolve whatever release is
        # newest at run time, so a new PyYAML landing on PyPI between this run
        # (on the PR) and main-verify.yml's later run (on the merge commit)
        # reproduces the exact same divergence one layer down. Pinned to the
        # exact same version as main-verify.yml, deliberately; there is no
        # shared lock/constraints file because this is the repo's only Python
        # dependency (verified: no requirements/constraints/pyproject file
        # exists, and every script under scripts/ imports only stdlib + yaml)
        # — a lock file for one package would be its own S-05-shaped debt.
        # Bump both `pip install pyyaml==` lines together when this needs to
        # move.
        run: pip install pyyaml==6.0.3
      - name: Restore executable bits
        # Rule 0 of this repo: a hook that is not executable fails SILENTLY.
        run: chmod +x hooks/*.sh tests/*.sh bootstrap.sh
      - name: Run every harness (this list must equal scripts/verify.sh's — release_test asserts it)
        run: |
          fail=0
          for t in hooks render_registry render_instructions gate_trio statelessness conformance companions scanner_agreement agent_presence notion_sync token_build release_test; do
            echo "::group::${t}_test.sh"
            bash "tests/${t}_test.sh" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  gates:
    name: "registry gates — every check script, against the kit itself"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      # A7: one checkout, one python setup, all checks. Each names the rule IDs
      # it enforces so a failure is traceable to REGISTRY.md.
      - name: Run all registry gates
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # Read via env, never interpolated into the script body — a ${{ }}
          # expression spliced into bash is a script-injection seam.
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          fail=0
          run() {
            echo "::group::$1"
            python "scripts/$1" || fail=1
            echo "::endgroup::"
          }
          # A skip must be louder than a pass, or it becomes a silent hole.
          skip() {
            echo "::notice title=Gate skipped::$1 ($2) — $3"
            echo "SKIPPED $1 ($2) — $3"
          }
          run check_commits.py         # C-06  <- needs BASE_REF; never ran here before
          run check_test_count.py      # C-08  <- needs BASE_REF; never ran here before
          run check_fixtures.py        # I-02 I-03 G-05
          # check_rollback reads the PR body for a rollback step (the
          # PR.template.md convention). A bot's body is a generated changelog and
          # never carries one, so every Dependabot PR failed this gate on the day
          # it was wired — and by A8 a gate that fires wrongly gets disabled,
          # taking O-02/O-03/D-05 with it for humans too. The rule this gate
          # exists to enforce is "a human thought about the rollback"; there is no
          # human to make think on a bot PR, and a dependency bump's rollback is
          # genuinely `revert`. Skipped loudly rather than relaxed, so the gap is
          # visible in the log and in the run summary. A bot PR that touches a
          # migration would still slip through — bots do not author migrations
          # here, and if that ever changes this condition is the thing to revisit.
          if [ "$PR_AUTHOR_TYPE" = "Bot" ]; then
            skip check_rollback.py "O-02 O-03 D-05" "PR authored by a bot; no PR body to carry a rollback step"
          else
            run check_rollback.py      # O-02 O-03 D-05
          fi
          run check_contract_pin.py    # K-02 K-03
          run check_guess_lists.py     # S-05
          run check_statelessness.py   # ST-01..ST-07
          run check_catch_empty.py     # S-03
          run check_log_hygiene.py     # O-05
          run check_raw_sql.py         # D-06
          run check_pure_imports.py    # S-07
          run check_instruction_honesty.py  # C-10
          exit $fail

# Registry resolution (A9 — IDs are permanent, every reference must resolve) is
# NOT a job here: conformance_test.sh already builds a temp manifest per registry
# section and runs render_registry.py --validate against each, and the harnesses
# job runs it. Adding a second copy would be S-05 in the CI layer. Note that
# `--validate` cannot run against this repo directly — it needs a manifest, and
# the kit is the registry's source, not a consumer of it.
